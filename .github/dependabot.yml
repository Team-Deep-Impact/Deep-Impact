version: 2
updates:
  # Configuration for npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'npm'

  # Configuration for pip dependencies
  - package-ecosystem: 'pip'
    directory: '/backend'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'python'
